<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>media-utils</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    color-scheme: light;
  }
  body {
    background: #fff !important;
    color: #000;
    font-family: "Diskopia", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  p.sub {
    color: #666;
    font-size: 13px;
    margin-bottom: 32px;
  }
  .container {
    width: 100%;
    max-width: 480px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"] {
    flex: 1;
    background: #f5f5f5;
    border: 1px solid #ddd;
    color: #000;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #000;
  }
  .modes {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1;
    background: #f5f5f5;
    border: 1px solid #ddd;
    color: #666;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: #000;
    color: #fff;
    border-color: #000;
  }
  button.main {
    width: 100%;
    background: #000;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.main:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.main:hover:not(:disabled) {
    opacity: 0.85;
  }
  #status {
    margin-top: 16px;
    font-size: 13px;
    color: #666;
    min-height: 18px;
    text-align: center;
  }
  #status.error { color: #d10000; }
  #status.ok { color: #0a8a2f; }
  .info-card {
    margin-top: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 16px;
    display: none;
  }
  .info-card.show { display: block; }
  .info-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .info-meta {
    font-size: 12px;
    color: #666;
  }
  .formats {
    margin-top: 12px;
    max-height: 200px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .format-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .format-row:hover {
    border-color: #000;
  }
  .format-row span.dl {
    color: #000;
    text-decoration: underline;
  }
</style>
</head>
<body>

<h1>media-utils</h1>
<p class="sub">pega el link, elige, descarga</p>

<div class="container">
  <div class="row">
    <input type="text" id="urlInput" placeholder="https://...">
  </div>

  <div class="modes">
    <div class="mode-btn active" data-mode="video">Video + audio</div>
    <div class="mode-btn" data-mode="video_only">Video sin audio</div>
    <div class="mode-btn" data-mode="audio">Solo audio (mp3)</div>
  </div>

  <button class="main" id="downloadBtn">Descargar</button>

  <div id="status"></div>

  <div class="info-card" id="infoCard">
    <div class="info-title" id="infoTitle"></div>
    <div class="info-meta" id="infoMeta"></div>
    <div class="formats" id="formatsList"></div>
  </div>
</div>

<script>
  let mode = "video";

  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      mode = btn.dataset.mode;
      document.getElementById("infoCard").classList.remove("show");
    });
  });

  const statusEl = document.getElementById("status");
  const btn = document.getElementById("downloadBtn");
  const urlInput = document.getElementById("urlInput");

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type || "";
  }

  async function triggerDownload(url, mode, formatId) {
    setStatus("Descargando... esto puede tardar según el tamaño", "");
    btn.disabled = true;
    try {
      let apiUrl = `/api/download?url=${encodeURIComponent(url)}&mode=${mode}`;
      if (formatId) apiUrl += `&format_id=${encodeURIComponent(formatId)}`;

      const res = await fetch(apiUrl);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "Error descargando");
      }
      const blob = await res.blob();
      const disposition = res.headers.get("Content-Disposition") || "";
      const extByMode = { audio: "mp3", video: "mp4", video_only: "mp4" };
      let filename = `download.${extByMode[mode] || "bin"}`;
      const match = disposition.match(/filename="?([^"]+)"?/);
      if (match) filename = match[1];

      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setStatus("Listo ✓", "ok");
    } catch (e) {
      setStatus(e.message, "error");
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", () => {
    const url = urlInput.value.trim();
    if (!url) {
      setStatus("Pega un link primero", "error");
      return;
    }
    triggerDownload(url, mode);
  });

  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btn.click();
  });
</script>

</body>
</html>
